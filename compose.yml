version: '3.7'

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    env_file:
      - .env
    environment:
      TELEGRAM_LOCAL: "true"
    volumes:
      - type: bind
        source: "${VOLUME_SOURCE}"  # Use environment variable for source
        target: "/var/lib/telegram-bot-api/"
    ports:
      - "8081:8081"

volumes:
  telegram-bot-api-data: